services:
  postgres:
    image: postgres:16-alpine
    container_name: afriscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afriscout
      POSTGRES_PASSWORD: afriscout
      POSTGRES_DB: afriscout
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - afriscout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afriscout -d afriscout"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: afriscout-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: afriscout_test
      POSTGRES_PASSWORD: afriscout_test
      POSTGRES_DB: afriscout_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - afriscout_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afriscout_test -d afriscout_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afriscout_postgres_data:
  afriscout_postgres_test_data: