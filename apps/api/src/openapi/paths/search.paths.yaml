search:
  post:
    tags: [Search]
    summary: Search opportunities
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [q]
            properties:
              q: { type: string, minLength: 2, maxLength: 200 }
              filters: { type: object }
              page: { type: integer, minimum: 1 }
              pageSize: { type: integer, minimum: 1, maximum: 100 }
    responses:
      "200":
        description: OK