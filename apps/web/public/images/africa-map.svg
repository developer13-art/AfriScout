<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-label="Map of Africa">
  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="640" fill="url(#map-bg)"/>
  <!-- Simplified continental outline. Replace with a real topojson-derived path when geodata is wired in. -->
  <path d="M300 40
           C 360 40, 420 60, 450 100
           C 480 140, 500 180, 520 220
           C 540 260, 545 300, 530 340
           C 515 380, 490 420, 470 460
           C 450 500, 430 530, 400 560
           C 370 590, 340 610, 300 620
           C 260 610, 230 590, 200 560
           C 170 530, 150 500, 130 460
           C 110 420, 85 380, 70 340
           C 55 300, 60 260, 80 220
           C 100 180, 120 140, 150 100
           C 180 60, 240 40, 300 40 Z"
        fill="#0F766E"
        fill-opacity="0.08"
        stroke="#0F766E"
        stroke-opacity="0.45"
        stroke-width="2"/>
  <!-- Location marker -->
  <circle cx="300" cy="300" r="8" fill="#10B981"/>
  <circle cx="300" cy="300" r="16" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="2"/>
</svg>