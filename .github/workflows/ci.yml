name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.11.0"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck all workspaces
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared
        run: npm run build:shared

      - name: Build API
        run: npm run build:api
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_ACCESS_SECRET: ci_access_secret_placeholder_min_64_chars_aaaaaaaaaaaaaaaaaaaaaaa
          JWT_REFRESH_SECRET: ci_refresh_secret_placeholder_min_64_chars_bbbbbbbbbbbbbbbbbbbbbb
          SUPER_ADMIN_EMAIL: ci@test.local
          SUPER_ADMIN_PASSWORD: CiTestPassword123!
          SUPER_ADMIN_FULL_NAME: CI Admin
          APIFY_WEBHOOK_SECRET: ci_apify_webhook_secret_min_32_chars_cccccccccc
          OUTBOUND_WEBHOOK_SECRET: ci_outbound_webhook_secret_min_32_chars_dddddddddd

      - name: Build Web
        run: npm run build:web
        env:
          VITE_API_URL: http://localhost:4000/api/v1
          VITE_PUBLIC_APP_URL: http://localhost:5173
          VITE_ENABLE_DEVTOOLS: "false"